name: npm-publish (forks only)

# Upstream Nevnet99/pond does NOT publish to npm.
# Forks: set repository variable POND_NPM_PUBLISH=true and configure Trusted Publishing
# (or NPM_TOKEN) before enabling this workflow's publish step.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ vars.POND_NPM_PUBLISH == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t build -p @pond/tokens,@pond/components

      - name: Publish packages
        run: |
          echo "Configure your fork's publish commands here (pnpm publish -r, etc.)."
          echo "Upstream Pond never sets POND_NPM_PUBLISH — this job is a no-op there."
          exit 0
