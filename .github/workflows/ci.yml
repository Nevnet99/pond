name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Build tokens + components
        run: pnpm exec nx run-many -t build -p @pond/tokens,@pond/components

      - name: Typecheck
        run: pnpm typecheck

      - name: CEM
        run: pnpm cem

      - name: Build Storybook
        run: pnpm exec nx run @pond/storybook:build

      - name: Build docs
        run: pnpm exec nx run @pond/docs:build

  # Same Playwright Ubuntu image as local `pnpm test:vrt` / `pnpm test:browser`.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build tokens + components
        run: pnpm exec nx run-many -t build -p @pond/tokens,@pond/components

      - name: Unit / a11y (browser)
        run: pnpm test:browser:native

      - name: VRT (mobile 375 / tablet 768 / desktop 1280)
        run: pnpm test:vrt:native

      - name: Upload VRT artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-screenshots
          path: |
            packages/components/src/**/__screenshots__/**
            packages/components/**/__screenshots__/**
          if-no-files-found: ignore
