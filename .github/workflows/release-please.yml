name: release-please

on:
  push:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # Manifest mode keeps room for multi-package later; single root for now.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
